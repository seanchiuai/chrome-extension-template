<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World Sidebar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #ffffff;
      position: relative;
    }
    
    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: transparent;
      border: 1px solid #e0e0e0;
      color: #666;
      font-size: 20px;
      font-weight: 300;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
    }
    
    .close-btn:hover {
      background: #f5f5f5;
      border-color: #ccc;
      color: #333;
    }
    
    .content {
      text-align: center;
    }
    
    h1 {
      color: #1a1a1a;
      font-size: 2.5em;
      font-weight: 300;
      text-align: center;
      margin-bottom: 15px;
      letter-spacing: -0.02em;
    }
    
    .info {
      color: #999;
      font-size: 0.85em;
      font-weight: 400;
      margin-top: 10px;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>
  <button class="close-btn" id="closeBtn" title="Close sidebar">×</button>
  <div class="content">
    <h1>Hello World</h1>
    <p class="info">Click the × button or extension icon to close</p>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
